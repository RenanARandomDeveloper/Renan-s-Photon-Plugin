---
neoforge-26.2:
  gradle: |
    repositories {
          maven {
              url = "https://maven.firstdark.dev/snapshots"
          }
      }
        dependencies {
        compileOnly 'org.appliedenergistics.yoga:yoga:1.0.0'
        compileOnly 'dev.vfyjxf:taffy:1.1.4'
        compileOnly 'org.projectlombok:lombok:1.18.48'
        annotationProcessor 'org.projectlombok:lombok:1.18.48'
        implementation('com.lowdragmc.ldlib2:ldlib2-neoforge-26.2:26.2.2.42') { transitive = false }
        implementation('com.lowdragmc.photon:photon-neoforge-26.2:26.2.2.3') { transitive = false }
      }
  update_files:
    - ~
