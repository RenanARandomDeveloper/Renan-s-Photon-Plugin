forge-1.20.1:
  gradle: |
    repositories {
        maven {
            url = "https://maven.firstdark.dev/snapshots"
        }
    }
    
    if (project.configurations.findByName("modImplementation") != null) {
        dependencies {
            modImplementation('com.lowdragmc.ldlib:ldlib-forge-1.20.1:1.0.52.a') { transitive = false }
            modImplementation('com.lowdragmc.photon:photon-forge-1.20.1:1.1.17') { transitive = false }
        }
    } else {
        minecraft {
            runs {
                client {
                    property 'mixin.env.remapRefMap', 'true'
                    property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
                }
                server {
                    property 'mixin.env.remapRefMap', 'true'
                    property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
                }
                data {
                    property 'mixin.env.remapRefMap', 'true'
                    property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
                }
            }
        }
    
        dependencies {
            implementation fg.deobf('com.lowdragmc.ldlib:ldlib-forge-1.20.1:1.0.52.a') { transitive = false }
            implementation fg.deobf('com.lowdragmc.photon:photon-forge-1.20.1:1.1.17') { transitive = false }
        }
    }
  update_files:
    - ~
name: "Photon API"