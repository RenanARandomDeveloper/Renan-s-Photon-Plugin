---
neoforge-1.21.1:
  gradle: |
    repositories {
            maven {
                url = "https://maven.firstdark.dev/snapshots"
            }
        }
        dependencies {
           compileOnly 'org.appliedenergistics.yoga:yoga:1.0.0'
           compileOnly 'dev.vfyjxf:taffy:1.1.4'
           compileOnly 'org.projectlombok:lombok:1.18.46'
           annotationProcessor 'org.projectlombok:lombok:1.18.46'
           implementation('com.lowdragmc.ldlib2:ldlib2-neoforge-1.21.1:2.2.31:all') { transitive = false }
           implementation('com.lowdragmc.photon:photon-neoforge-1.21.1:2.2.1:all') { transitive = false }
           implementation('com.lowdragmc.kilagraph:kilagraph-neoforge-1.21.1:21.1.0.7') { transitive = false }
        }
  update_files:
    - ~
forge-1.20.1:
  gradle: |
    repositories {
        maven {
            url = "https://maven.firstdark.dev/snapshots"
        }
    }
    
    if (project.configurations.findByName("modImplementation") != null) {
        dependencies {
            modImplementation('com.lowdragmc.ldlib:ldlib-forge-1.20.1:1.0.52') { transitive = false }
            modImplementation('com.lowdragmc.photon:photon-forge-1.20.1:1.1.17') { transitive = false }
        }
    } else {
        minecraft {
            runs {
                client {
                    property 'mixin.env.remapRefMap', 'true'
                    property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
                }
                server {
                    property 'mixin.env.remapRefMap', 'true'
                    property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
                }
                data {
                    property 'mixin.env.remapRefMap', 'true'
                    property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
                }
            }
        }
    
        dependencies {
            implementation fg.deobf('com.lowdragmc.ldlib:ldlib-forge-1.20.1:1.0.52') { transitive = false }
            implementation fg.deobf('com.lowdragmc.photon:photon-forge-1.20.1:1.1.17') { transitive = false }
        }
    }
  update_files:
    - ~
name: "Photon API"